name: Deploy HubSolidario

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Deploy para cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar PHP no GitHub Runner
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Instalar Dependências (Build da pasta vendor)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Compactar projeto para envio rápido
        run: zip -r deploy.zip . -x "*.git*"

      - name: Enviar arquivo ZIP para o Servidor (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "/home/remotoagenciaco/hubsolidario.remotoagencia.com.br"

      - name: Descompactar e Configurar no cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/remotoagenciaco/hubsolidario.remotoagencia.com.br
            
            # Modo manutenção
            /opt/cpanel/ea-php82/root/usr/bin/php artisan down || true
            
            # Descompacta sobrescrevendo os arquivos antigos e apaga o zip
            unzip -o deploy.zip
            rm deploy.zip
            
            # Permissões de segurança do Laravel
            chmod -R 775 storage bootstrap/cache
            
            # Executa Migrations e limpa Cache com o PHP 8.2 absoluto
            /opt/cpanel/ea-php82/root/usr/bin/php artisan migrate --force
            /opt/cpanel/ea-php82/root/usr/bin/php artisan optimize:clear
            
            # Aplicação no ar
            /opt/cpanel/ea-php82/root/usr/bin/php artisan up