services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubsolidario-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hubsolidario_db
      DB_USERNAME: hub_user
      DB_PASSWORD: hub_password
    depends_on:
      - db
    networks:
      - hubsolidario-network

  db:
    image: mysql:8.0
    container_name: hubsolidario-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hubsolidario_db
      MYSQL_USER: hub_user
      MYSQL_PASSWORD: hub_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - hubsolidario-db-data:/var/lib/mysql
    networks:
      - hubsolidario-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hubsolidario-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - hubsolidario-network

networks:
  hubsolidario-network:
    driver: bridge

volumes:
  hubsolidario-db-data:
    driver: local